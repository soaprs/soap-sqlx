[package]
name = "soaprs-sqlx"
version = "0.3.0"
edition = "2024"
rust-version = "1.94"
description = "SQLx database adapters for soaprs"
license = "MIT"
repository = "https://github.com/soaprs/soap-sqlx"
homepage = "https://github.com/soaprs/soap-sqlx"
readme = "README.md"
keywords = ["clean-architecture", "ddd", "repository-pattern", "postgresql", "sqlx"]
categories = ["database", "development-tools"]
publish = true

[features]
default = ["postgres", "postgres-types", "runtime-tokio-rustls"]
postgres = ["sqlx/postgres"]
postgres-types = ["sqlx/chrono", "sqlx/json", "sqlx/rust_decimal", "sqlx/uuid"]
runtime-tokio-rustls = ["sqlx/runtime-tokio", "sqlx/tls-rustls-ring-webpki"]

[dependencies]
async-lock = "3"
soaprs-core = "0.3.0"
soaprs-repository = "0.3.0"
sqlx = { version = "0.9.0", default-features = false }

[dev-dependencies]
soaprs-contract-tests = "0.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
expect_used = "deny"
unwrap_used = "deny"
